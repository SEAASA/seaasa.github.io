<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEAASA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #090d16;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }

    h1 {
      font-size: clamp(2.8rem, 7vw, 5rem);
      font-weight: 800;
      letter-spacing: 0.25em;
      margin-right: -0.25em; /* Offsets letter-spacing for true center */
      margin-bottom: 16px;
    }

    p {
      font-size: clamp(0.85rem, 2vw, 1.05rem);
      font-weight: 500;
      letter-spacing: 0.2em;
      color: #94a3b8;
      text-transform: uppercase;
    }

    footer {
      position: absolute;
      bottom: 24px;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      color: #475569;
    }
  </style>
</head>
<body>

  <main>
    <h1>SEAASA</h1>
    <p>We Develop Custom Mobile Apps</p>
  </main>

  <footer>&copy; 2026 SEAASA PRIVATE LIMITED</footer>

</body>
</html>
